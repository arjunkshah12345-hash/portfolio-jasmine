# ─── Flappy Bird 24/7 Evolution ───────────────────────────────
# Scheduled pipeline runs NEAT evolution locally every 10 minutes.
# Updates latest-brain.json and commits it back to the repo.
# Vercel redeploys → all visitors fetch the same brain file.

image: node:20-alpine

evolve-birds:
  before_script:
    - apk add --no-cache git
    - git config user.name "Bot"
    - git config user.email "bot@arjunshah.xyz"
  script:
    - node scripts/evolve.js
    - git add latest-brain.json
    - git diff --cached --quiet && echo "No brain changes" || (
        git commit -m "chore: evolve birds [skip ci]" &&
        git remote set-url origin https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/arjunkshah/portfolio-jasmine.git &&
        git push origin HEAD:main
      )
  only:
    - schedules
