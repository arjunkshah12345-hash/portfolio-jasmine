# ─── Flappy Bird 24/7 Evolution ───────────────────────────────
# Scheduled pipeline pings the evolution API every 10 minutes.
# Each invocation runs 400 generations of NEAT evolution.
# The server caches the best brain in memory for client fetches.

image: alpine:latest

evolve-birds:
  script:
    - apk add --no-cache curl
    - curl -s -o /dev/null -w "%{http_code}" https://arjunshah.xyz/api/evolve
  only:
    - schedules
  tags:
    - docker
