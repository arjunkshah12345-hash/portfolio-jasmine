# ─── Flappy Bird 24/7 Evolution ───────────────────────────────
# Scheduled pipeline pings /api/evolve every 10 minutes.
# The Vercel serverless function is the SINGLE SOURCE OF TRUTH:
# - Runs 400 generations of NEAT evolution
# - Stores the brain in its in-memory state
# - All visitors fetch from /api/evolve?stats=1 → same brain
# - Keeps the serverless instance warm (no cold starts)

evolve-birds:
  image: alpine:latest
  before_script:
    - apk add --no-cache curl
  script:
    - curl -s -o /dev/null -w "HTTP %{http_code} — %{url_effective}" https://arjunshah.xyz/api/evolve
  only:
    - schedules
