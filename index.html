<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arjun Shah — Notes</title>
    <meta property="og:title" content="Arjun Shah — Portfolio">
    <meta property="og:description" content="Crafted software and AI-led experiences.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.arjunshah.xyz/">
    <meta property="og:image" content="https://www.arjunshah.xyz/social-card.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Arjun Shah — Portfolio">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Arjun Shah — Portfolio">
    <meta name="twitter:description" content="Crafted software and AI-led experiences.">
    <meta name="twitter:image" content="https://www.arjunshah.xyz/social-card.png">
    <meta name="twitter:image:alt" content="Arjun Shah — Portfolio social preview">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300;1,6..72,400&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Tailwind Config for Standalone Preview -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        paper: 'var(--bg)',
                        ink: { DEFAULT: 'var(--text)', light: 'var(--text-light)' }
                    },
                    fontFamily: {
                        serif: ['"Newsreader"', 'serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    },
                    transitionTimingFunction: {
                        'smooth': 'cubic-bezier(0.16, 1, 0.3, 1)',
                    }
                }
            }
        }
    </script>

    <!-- Jasmine badge font -->
    <style>
        @font-face{font-family:'Iowan Old Style';src:url('https://tryjasmine.dev/fonts/IowanOld.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap;}
        .jasmine-badge{font-family:'Iowan Old Style','Iowan Old Serif',Georgia,'Times New Roman',serif;letter-spacing:0.02em;}
    </style>

    <style>
        :root {
            --bg: #f2f0e9;
            --text: #1c1c1a;
            --text-light: #6b6a65;
            --noise-opacity: 0.04;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Newsreader', serif;
            -webkit-font-smoothing: antialiased;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E");
            transition: background-color 0.4s ease, color 0.4s ease;
        }
        ::selection { background-color: var(--text); color: var(--bg); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    
    <!-- Framer Motion -->
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div id="root"></div>

    <script src="/app.js"></script>
</body>
</html>
